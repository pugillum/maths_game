<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Times Tables Practice</title>
<style>
  :root {
    color-scheme: light;
    --bg-top: #1e2a5e;
    --bg-bottom: #4b2a7a;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  #play-area {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }

  #equation-bar {
    flex: 0 0 auto;
    width: 100%;
    padding: 1.1rem 0 calc(1.4rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    background: rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(2px);
  }

  #equation {
    font-size: clamp(2.2rem, 10vw, 3.4rem);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.03em;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }

  .ball {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--size) * 0.4);
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    cursor: pointer;
    border: none;
    padding: 0;
    box-shadow: inset -6px -8px 14px rgba(0, 0, 0, 0.2), inset 6px 6px 10px rgba(255, 255, 255, 0.35), 0 6px 12px rgba(0, 0, 0, 0.25);
    transform: translate(var(--x), var(--y));
    animation: float var(--float-dur) ease-in-out var(--float-delay) infinite alternate;
    touch-action: none;
  }

  @keyframes float {
    0% {
      transform: translate(calc(var(--x) - var(--drift-x)), calc(var(--y) - var(--drift-y))) rotate(-3deg);
    }
    100% {
      transform: translate(calc(var(--x) + var(--drift-x)), calc(var(--y) + var(--drift-y))) rotate(3deg);
    }
  }

  .ball.dissolve {
    animation: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(0.3);
    pointer-events: none;
  }

  .ball.correct {
    animation: none;
    transition: background 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
    background: radial-gradient(circle at 35% 30%, #7dffb0, #16b862) !important;
    transform: translate(var(--x), var(--y)) scale(1.25);
    box-shadow: 0 0 0 6px rgba(60, 255, 140, 0.35), 0 8px 20px rgba(0, 0, 0, 0.3);
    z-index: 5;
  }

  .ball.fade-out {
    transition: opacity 0.35s ease;
    opacity: 0;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    top: 0;
    left: 0;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(var(--px), var(--py));
    opacity: 1;
    animation: burst 0.9s ease-out forwards;
  }

  @keyframes burst {
    0% {
      transform: translate(var(--px), var(--py)) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(calc(var(--px) + var(--tx)), calc(var(--py) + var(--ty))) scale(0.2);
      opacity: 0;
    }
  }

  #message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    font-size: clamp(1.6rem, 8vw, 2.6rem);
    font-weight: 800;
    color: #fff;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.45);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    text-align: center;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: nowrap;
  }

  #message.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
</style>
</head>
<body>
  <div id="play-area">
    <div id="message"></div>
  </div>
  <div id="equation-bar">
    <div id="equation">? x ?</div>
  </div>

<script>
(function () {
  "use strict";

  var playArea = document.getElementById("play-area");
  var equationEl = document.getElementById("equation");
  var messageEl = document.getElementById("message");

  var BALL_COLORS = [
    ["#ff6b6b", "#c92a2a"],
    ["#ffa94d", "#e8590c"],
    ["#ffd43b", "#f08c00"],
    ["#69db7c", "#2f9e44"],
    ["#4dabf7", "#1864ab"],
    ["#9775fa", "#5f3dc4"],
    ["#f783ac", "#a61e4d"],
    ["#3bc9db", "#0b7285"]
  ];

  var PRAISE = [
    "Nice one!", "Great job!", "Correct!", "You got it!",
    "Awesome!", "Brilliant!", "Well done!", "Superstar!"
  ];

  var locked = false; // true once correct answer chosen, until next question loads
  var currentAnswer = null;

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function randInt(min, max) {
    return Math.floor(rand(min, max + 1));
  }

  function choice(arr) {
    return arr[randInt(0, arr.length - 1)];
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randInt(0, i);
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function generateDistractors(a, b, correct, count) {
    var pool = new Set();

    function add(v) {
      if (v > 0 && v !== correct) pool.add(v);
    }

    if (b > 1) add(a * (b - 1));
    add(a * (b + 1));
    if (a > 1) add((a - 1) * b);
    add((a + 1) * b);
    add(correct + 1);
    add(correct - 1);
    add(correct + 2);
    add(correct - 2);
    add(correct + 3);
    add(correct - 3);

    var candidates = shuffle(Array.from(pool));
    var result = candidates.slice(0, count);

    // Top up with small random offsets if the pool was too short.
    var attempts = 0;
    while (result.length < count && attempts < 50) {
      attempts++;
      var offset = choice([-4, -3, -2, -1, 1, 2, 3, 4]);
      var candidate = correct + offset;
      if (candidate > 0 && candidate !== correct && result.indexOf(candidate) === -1) {
        result.push(candidate);
      }
    }

    return result;
  }

  function clearBoard() {
    var balls = playArea.querySelectorAll(".ball");
    balls.forEach(function (b) { b.remove(); });
  }

  function placeBalls(values) {
    var areaRect = playArea.getBoundingClientRect();
    var size = Math.max(56, Math.min(84, areaRect.width / 5));
    var placed = [];

    values.forEach(function (value) {
      var ball = document.createElement("button");
      ball.className = "ball";
      ball.type = "button";
      ball.textContent = value;
      ball.setAttribute("aria-label", "Answer " + value);

      var colors = choice(BALL_COLORS);
      ball.style.background = "radial-gradient(circle at 35% 30%, " + colors[0] + ", " + colors[1] + ")";
      ball.style.setProperty("--size", size + "px");

      var pos = findPosition(areaRect, size, placed);
      placed.push(pos);

      ball.style.setProperty("--x", pos.x + "px");
      ball.style.setProperty("--y", pos.y + "px");
      ball.style.setProperty("--drift-x", rand(6, 16).toFixed(1) + "px");
      ball.style.setProperty("--drift-y", rand(8, 20).toFixed(1) + "px");
      ball.style.setProperty("--float-dur", rand(2.4, 4).toFixed(2) + "s");
      ball.style.setProperty("--float-delay", rand(0, 1.5).toFixed(2) + "s");

      ball.dataset.value = value;
      ball.addEventListener("pointerdown", onBallTap, { passive: true });

      playArea.appendChild(ball);
    });
  }

  function findPosition(areaRect, size, placed) {
    var maxX = Math.max(0, areaRect.width - size);
    var maxY = Math.max(0, areaRect.height - size);
    var minDist = size * 1.15;

    for (var attempt = 0; attempt < 40; attempt++) {
      var x = rand(0, maxX);
      var y = rand(0, maxY);
      var ok = true;
      for (var i = 0; i < placed.length; i++) {
        var dx = placed[i].x - x;
        var dy = placed[i].y - y;
        if (Math.sqrt(dx * dx + dy * dy) < minDist) {
          ok = false;
          break;
        }
      }
      if (ok) return { x: x, y: y };
    }
    // Fallback: accept last attempted position even if a bit close.
    return { x: rand(0, maxX), y: rand(0, maxY) };
  }

  function onBallTap(e) {
    if (locked) return;
    var ball = e.currentTarget;
    var value = Number(ball.dataset.value);

    if (value === currentAnswer) {
      handleCorrect(ball);
    } else {
      handleWrong(ball);
    }
  }

  function handleWrong(ball) {
    ball.classList.add("dissolve");
    ball.addEventListener("transitionend", function () {
      ball.remove();
    }, { once: true });
  }

  function handleCorrect(correctBall) {
    locked = true;

    var otherBalls = playArea.querySelectorAll(".ball:not(.correct)");
    otherBalls.forEach(function (b) {
      if (b !== correctBall) b.classList.add("fade-out");
    });

    correctBall.classList.add("correct");

    spawnFireworks(correctBall);

    messageEl.textContent = choice(PRAISE);
    messageEl.classList.add("show");

    setTimeout(function () {
      messageEl.classList.remove("show");
      clearBoard();
      nextQuestion();
      locked = false;
    }, 1400);
  }

  function spawnFireworks(fromBall) {
    var rect = fromBall.getBoundingClientRect();
    var areaRect = playArea.getBoundingClientRect();
    var cx = rect.left - areaRect.left + rect.width / 2;
    var cy = rect.top - areaRect.top + rect.height / 2;

    var particleCount = 20;
    for (var i = 0; i < particleCount; i++) {
      var particle = document.createElement("div");
      particle.className = "particle";
      var angle = (Math.PI * 2 * i) / particleCount + rand(-0.2, 0.2);
      var distance = rand(50, 130);
      var colors = choice(BALL_COLORS);

      particle.style.background = colors[0];
      particle.style.setProperty("--px", cx + "px");
      particle.style.setProperty("--py", cy + "px");
      particle.style.setProperty("--tx", (Math.cos(angle) * distance).toFixed(1) + "px");
      particle.style.setProperty("--ty", (Math.sin(angle) * distance).toFixed(1) + "px");

      playArea.appendChild(particle);
      (function (p) {
        setTimeout(function () { p.remove(); }, 950);
      })(particle);
    }
  }

  function nextQuestion() {
    var a = randInt(1, 10);
    var b = randInt(1, 10);
    var correct = a * b;
    currentAnswer = correct;

    equationEl.textContent = a + " × " + b;

    var ballCount = randInt(4, 6);
    var distractors = generateDistractors(a, b, correct, ballCount - 1);
    var values = shuffle([correct].concat(distractors));

    placeBalls(values);
  }

  nextQuestion();
})();
</script>
</body>
</html>
